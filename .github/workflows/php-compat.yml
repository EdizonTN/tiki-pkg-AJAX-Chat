name: PHP compatibility

on:
  push:
    branches:
      - "mz/**"
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, iconv
          coverage: none

      - name: Check required extensions
        run: php -r "exit(extension_loaded('mysqli') ? 0 : 1);"

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          find chat _custom tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Test Tiki token helper
        run: php tests/test_mz_chat_auth.php
